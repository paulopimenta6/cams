[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cams-global-air-quality"
version = "0.1.0"
description = "Auditable, incremental CAMS EAC4 historical air-quality pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26.4,<2", "pandas>=2.2,<3", "xarray>=2025.3,<2025.4",
  "dask[array]>=2025.3,<2025.4", "zarr>=2.18,<3", "netCDF4>=1.7.2,<1.7.3",
  "h5netcdf>=1.6,<2", "h5py>=3.12,<4", "cftime>=1.6.4,<1.6.5", "cfgrib>=0.9.15,<0.10", "eccodes>=2.38,<3", "ecmwf-datastores-client==0.5.3",
  "cdsapi>=0.7.7,<0.8", "requests>=2.32,<3", "PyYAML>=6,<7",
  "filelock>=3.16,<4", "scipy>=1.15,<1.16", "fastparquet>=2024.11,<2026",
  "matplotlib>=3.10,<3.11", "cartopy>=0.24,<0.25"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1.2"]
notebooks = ["jupyterlab>=4", "nbclient>=0.10"]
[project.scripts]
camsaq = "cams_air_quality.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
